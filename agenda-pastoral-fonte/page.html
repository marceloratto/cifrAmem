<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenda Pastoral</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Spectral:wght@500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: sereno e profissional, prático como o app Calendário do celular
   IDEA: o Diretório Litúrgico — cada dia marcado pela fita colorida do missal
   PICTURE: o próprio mês: fita da cor litúrgica sob cada dia, pontos coloridos das pastorais
   COLOUR and TYPE: branco ou noite, tinta escura, vinho como acento, cores litúrgicas como fitas; Spectral + Inter
   LAYOUT: barra do mês, faixa do tempo litúrgico, grade; painel do dia ao lado (largo) ou abaixo (celular) */
:root{color-scheme:light dark;--bg:light-dark(#fff,#111113);--ink:light-dark(#1b1a17,#ecebe7);--mut:light-dark(#6c6860,#a29e96);--line:light-dark(#e9e5dd,#2a2a2e);--card:light-dark(#f8f6f1,#1a1a1d);--acc:light-dark(#8a1c3b,#e8869f);--onacc:light-dark(#fff,#1a0b10);
--lw:light-dark(#e6d6a3,#cdb97a);--lv:light-dark(#6a3fa3,#9b78d0);--lg:light-dark(#2e7a3c,#5fae6b);--lr:light-dark(#c0392b,#e0675a);--lp:light-dark(#e38aae,#e9a0bf)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
:root[data-ui=light]{color-scheme:light}:root[data-ui=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:auto;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;padding:.6rem max(4vw,12px)}
.brand{font:600 .8rem Inter;color:var(--mut);width:100%;display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.brand b{color:var(--acc);font-weight:700;letter-spacing:.01em}
#mt{font:600 clamp(1.6rem,4.5vw,2.4rem)/1.05 Spectral,Georgia,serif;margin:0;text-transform:capitalize;flex:1 1 auto}
#mt span{color:var(--mut);font-weight:500}
.nav{display:flex;gap:.35rem;align-items:center;flex-wrap:wrap}
.btn{min-height:44px;padding:0 1rem;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--mut)}.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.del{color:var(--lr);border-color:color-mix(in srgb,var(--lr) 40%,transparent)}.btn.sm{min-height:36px;padding:0 .7rem;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:default}
.ic{width:44px;padding:0;font-size:1.2rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{min-height:40px;padding:0 .8rem;border:0;background:none;font-weight:600;font-size:.85rem;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.tools{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
#fsv{font-size:.8rem;color:var(--mut);min-width:3.2em;text-align:center}
#pick[aria-pressed=true]{background:var(--ink);color:var(--bg)}
#rib{--lc:var(--lg);display:flex;flex-wrap:wrap;gap:.2rem .8rem;align-items:baseline;padding:.65rem max(4vw,12px);background:var(--lc);color:#fff}
#rib[data-c=w],#rib[data-c=p]{color:#2a2115}
#rib b{font:600 1.1rem Spectral,Georgia,serif}#rib span{font-size:.88rem;opacity:.92}
#note{margin:0;padding:.5rem max(4vw,12px);font-size:.82rem;background:var(--card);color:var(--mut);border-bottom:1px solid var(--line)}
main{max-width:1240px;margin:auto;padding:1rem max(4vw,12px) 6rem}
#mview{display:grid;gap:1.2rem}
@media(min-width:900px){#mview{grid-template-columns:minmax(0,1.75fr) minmax(300px,1fr);align-items:start}#day{position:sticky;top:120px}}
.wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:.72rem;font-weight:600;color:var(--mut);text-align:center;padding-bottom:.4rem}
#grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.c{position:relative;min-height:4.4rem;border:0;border-top:1px solid var(--line);background:none;padding:.35rem .15rem .7rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;text-align:center}
.c .n{display:inline-grid;place-items:center;width:2rem;height:2rem;border-radius:50%;font-weight:500;font-variant-numeric:tabular-nums}
.c.out .n{color:var(--mut);opacity:.55}
.c:not(:nth-child(7n+1)) .n{}
.c:nth-child(7n+1) .n{color:var(--acc)}
.c.today .n{color:var(--acc);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--acc)}
.c.sel .n{background:var(--ink);color:var(--bg);box-shadow:none}.c.today.sel .n{background:var(--acc);color:var(--onacc)}
.c .rb{position:absolute;left:.35rem;right:.35rem;bottom:.25rem;height:.26rem;border-radius:2px}
.s{position:absolute;top:.45rem;right:.35rem;width:.42rem;height:.42rem;transform:rotate(45deg);background:var(--acc)}.s.F{background:none;box-shadow:inset 0 0 0 1.5px var(--acc)}
.dots{display:flex;gap:3px;justify-content:center;min-height:.4rem}.dots i{width:.4rem;height:.4rem;border-radius:50%}
.cl,.chips{display:none}
@media(min-width:700px){.c{min-height:6.6rem;align-items:stretch;text-align:left;padding:.3rem .3rem .8rem}.c .n{width:1.8rem;height:1.8rem;font-size:.92rem}.dots{display:none}
 .cl{display:block;font-size:.66rem;line-height:1.2;color:var(--mut);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
 .chips{display:flex;flex-direction:column;gap:2px}.chips em{font-style:normal;font-size:.7rem;line-height:1.25;padding:1px 4px;border-radius:4px;background:color-mix(in srgb,var(--c) 16%,transparent);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .chips .more{background:none;border:0;color:var(--mut)}}
#day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem}
.dh{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap}
.dh h2{font:600 1.35rem/1.15 Spectral,Georgia,serif;margin:0;text-transform:capitalize}
.lit{display:flex;gap:.7rem;margin:.8rem 0;padding:.7rem .8rem;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.lit .sw{flex:none;width:.5rem;border-radius:3px;background:var(--lc)}
.lit[data-c=w] .sw{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 18%,transparent)}
.lit strong{display:block;font:600 1.02rem/1.3 Spectral,Georgia,serif}
.lit span{font-size:.84rem;color:var(--mut)}
.rk{display:inline-block;margin:.15rem 0;font-size:.7rem;font-weight:700;color:var(--acc);text-transform:uppercase}
.evs{display:grid;gap:.5rem}
.ev{display:flex;align-items:stretch;gap:.4rem}
.evb{flex:1;display:flex;gap:.8rem;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:.65rem .8rem;border-left:4px solid var(--c);min-height:44px}
.evb:hover{border-color:var(--mut);border-left-color:var(--c)}
.tm{flex:none;width:4.2em;font-weight:600;font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;flex-direction:column}
.tm small{color:var(--mut);font-weight:500}
.tx{display:flex;flex-direction:column}.tx strong{font-weight:600}.tx span{font-size:.82rem;color:var(--mut)}
.pk{display:grid;place-items:center;width:44px}.pk input,.agr input,.tg input{width:1.25rem;height:1.25rem;accent-color:var(--acc)}
.empty{color:var(--mut);font-size:.92rem;margin:.6rem 0}
#lview .lh{color:var(--mut);font-size:.85rem;margin:0 0 .5rem}
.ld{border-top:1px solid var(--line);padding:.8rem 0;display:grid;gap:.5rem}
.ld h3{margin:0}.ld h3 button{border:0;background:none;padding:0;font:600 1.1rem Spectral,Georgia,serif;text-transform:capitalize;min-height:32px}
.ld .lit{margin:0}
#pbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--ink);color:var(--bg);padding:.6rem max(4vw,12px) calc(.6rem + env(safe-area-inset-bottom))}
#pbar>div{max-width:1240px;margin:auto;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
#pbar #pn{flex:1;font-weight:600}
#pbar .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}#pbar .btn.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
#sh{position:fixed;inset:0;z-index:20;background:rgba(10,8,6,.45);display:flex;align-items:flex-end;justify-content:center}
#sh[hidden]{display:none}
.sp{background:var(--bg);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:1rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom));display:grid;gap:.75rem;animation:up .22s ease-out}
@media(min-width:700px){#sh{align-items:center}.sp{border-radius:20px}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sp{animation:none}}
.sp form{display:grid;gap:.75rem}
.shh{display:flex;justify-content:space-between;align-items:center}.shh h3{margin:0;font:600 1.35rem Spectral,Georgia,serif}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);font-size:1rem}
.sp label{display:grid;gap:.25rem;font-size:.82rem;font-weight:600;color:var(--mut)}
.sp input:not([type=checkbox]):not([type=color]),.sp select,.sp textarea{font-size:16px;min-height:44px;padding:.5rem .7rem;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
.sp label.tg{display:flex;align-items:center;gap:.5rem;align-self:end;min-height:44px;color:var(--ink)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.6rem}.two[hidden]{display:none}
.act{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.3rem}.act span{flex:1}
.sub{margin:.3rem 0 0;font-size:.85rem;font-weight:700;color:var(--mut)}
.fine{margin:0;font-size:.82rem;color:var(--mut)}
.ph{display:flex;gap:.4rem;flex-wrap:wrap}
.agl{display:grid;gap:.3rem}.agr{display:flex;align-items:center;gap:.5rem;border-bottom:1px solid var(--line);padding:.3rem 0}
.agr label{flex:1;display:flex !important;align-items:center;gap:.6rem;min-height:44px;color:var(--ink) !important;font-size:.95rem !important}
.agr i{flex:none;width:.9rem;height:.9rem;border-radius:50%}.agr span{display:flex;flex-direction:column}.agr small{color:var(--mut);font-weight:500;font-size:.8rem}
.leg{display:flex;flex-wrap:wrap;gap:.4rem 1rem;font-size:.85rem}.leg span{display:inline-flex;align-items:center;gap:.4rem}.leg i{width:1.1rem;height:.35rem;border-radius:2px}.leg i.s{position:static;width:.45rem;height:.45rem}
.leg span[data-c=w] i{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 20%,transparent)}
.sws{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center}.sws button{width:2.2rem;height:2.2rem;border-radius:50%;border:2px solid transparent}.sws button[aria-pressed=true]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.sws input{width:2.6rem;height:2.4rem;border:0;background:none;padding:0}
.sr{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:.6rem .8rem;display:grid;gap:.45rem}.sr small{display:block;color:var(--mut);font-size:.82rem}
#toast{position:fixed;left:50%;bottom:5.5rem;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){.hide-s{display:none}.c{min-height:3.9rem}}
</style></head><body>
<header class="top"><div class="bar">
 <div class="brand"><span><b>Agenda Pastoral</b> · calendário litúrgico e das pastorais</span>
  <span class="tools"><span class="seg" role="group" aria-label="Tema"><button data-th="auto">Auto</button><button data-th="light">Claro</button><button data-th="dark">Escuro</button></span>
  <span class="seg" role="group" aria-label="Tamanho da letra"><button id="fsm" aria-label="Diminuir letra">A−</button><span id="fsv" aria-live="polite">100%</span><button id="fsp" aria-label="Aumentar letra">A+</button></span></span></div>
 <h1 id="mt">mês</h1>
 <div class="nav"><button class="btn ic" id="prev" aria-label="Mês anterior">‹</button><button class="btn" id="today">Hoje</button><button class="btn ic" id="next" aria-label="Próximo mês">›</button>
  <span class="seg" role="group" aria-label="Visualização"><button data-v="mes">Mês</button><button data-v="lista">Lista</button></span>
  <button class="btn" id="ags">Agendas</button><button class="btn" id="pick" aria-pressed="false">Selecionar</button><button class="btn pri" data-new>+ <span class="hide-s">Evento</span></button></div>
</div><div id="rib"></div><p id="note" hidden></p></header>
<main><div id="mview"><div><div class="wd"><span>DOM</span><span>SEG</span><span>TER</span><span>QUA</span><span>QUI</span><span>SEX</span><span>SÁB</span></div><div id="grid"></div></div><aside id="day" aria-live="polite"></aside></div>
<div id="lview" hidden></div></main>
<div id="pbar" hidden><div><span id="pn"></span><button class="btn" id="pall">Marcar todos visíveis</button><button class="btn pri" id="psend" disabled>Enviar para o celular</button></div></div>
<div id="sh" hidden></div><div id="toast" role="status"></div>
<script>{

/*APP*/
}</script></body></html>
