<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matarello</title>
<meta name="description" content="Matarello – caderno de receitas com foto, ingredientes, equipamentos e passo a passo, com importação de PDF, vídeo, foto e texto.">
<meta name="theme-color" content="#d63a2c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
/* VOICE: caloroso como uma trattoria, organizado como um caderno profissional de cozinha
   IDEA: um caderno de receitas italiano com capa de toalha xadrez e lombada tricolor
   PICTURE: o mascote chef num medalhão sobre a toalha vermelha; fichas com foto grande
   COLOUR and TYPE: tomate #d63a2c, manjericão #2f8a4b, massa #f2b441 sobre branco; Lobster no nome, Fraunces nos títulos, Nunito Sans no texto
   LAYOUT: capa centralizada, grade de fichas, ficha da receita com ingredientes ao lado do preparo */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#17110f);--paper:light-dark(#ffffff,#221a16);--soft:light-dark(#f6f2ef,#2b211c);
--ink:light-dark(#2b1d18,#f7eee8);--mute:light-dark(#6e5c54,#bfaba1);--line:light-dark(#ece2dc,#3b2e28);
--tomato:#d63a2c;--tomato-d:light-dark(#a92a1f,#ff7a6b);--basil:light-dark(#2f8a4b,#62c682);--pasta:#f2b441;
--shadow:0 1px 2px rgb(60 20 10/.06),0 10px 30px rgb(80 30 20/.09)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Nunito Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:800;line-height:1.08;text-wrap:balance;margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.band{padding:clamp(24px,4vw,56px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding:10px max(5vw,16px);max-width:calc(1240px + 10vw)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{width:42px;height:42px;border-radius:50%;border:2px solid var(--tomato);background:#fff}
.logo b{font:400 28px/1 Lobster,cursive;color:var(--tomato)}
.top nav{margin-left:auto;display:flex;gap:8px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--tomato);color:var(--tomato-d)}
.btn.red{background:var(--tomato);border-color:var(--tomato);color:#fff}.btn.red:hover{background:#b92e22;color:#fff}
.btn.green{background:var(--basil);border-color:var(--basil);color:#fff}
.btn.light{background:#fff;color:#a92a1f;border-color:#fff}
.btn.ghost-l{background:transparent;color:#fff;border-color:rgb(255 255 255/.7)}.btn.ghost-l:hover{background:rgb(255 255 255/.12);color:#fff}
.btn.quiet{border-color:transparent;background:transparent;color:var(--mute)}
.btn:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:3px solid var(--pasta);outline-offset:2px}
@media(max-width:600px){.top nav .btn span{display:none}.top nav .btn{padding:0 13px}}
/* cover */
.hero{position:relative;color:#fff;text-align:center;background:
 repeating-linear-gradient(0deg,rgb(255 255 255/.10) 0 28px,transparent 28px 56px),
 repeating-linear-gradient(90deg,rgb(255 255 255/.10) 0 28px,transparent 28px 56px),var(--tomato)}
.medal{width:clamp(190px,30vw,300px);aspect-ratio:1;margin:0 auto;border-radius:50%;background:#fff;padding:8px;box-shadow:0 0 0 8px rgb(255 255 255/.25),0 20px 50px rgb(80 10 0/.35)}
.medal img{width:100%;height:100%;border-radius:50%;display:block}
.kicker{font-weight:800;font-size:14px;margin:0 0 6px;letter-spacing:.02em}
.brand{font:400 clamp(58px,10vw,104px)/1 Lobster,cursive;margin:18px 0 6px;text-shadow:0 3px 0 rgb(120 20 10/.35)}
.lede{font-size:17px;max-width:62ch;margin:0 auto 20px;opacity:.95}
.hero-act{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.stats{display:flex;justify-content:center;gap:clamp(18px,5vw,56px);margin:26px 0 0;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column-reverse}.stats dt{font-size:14px;opacity:.85}.stats dd{margin:0;font:800 34px/1 Fraunces,serif}
.tricolor{height:10px;background:linear-gradient(90deg,#2f8a4b 0 33.3%,#fff 33.3% 66.6%,#d63a2c 66.6%);border-bottom:1px solid var(--line)}
/* list */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools h2{font-size:32px;margin-right:auto}
.search{position:relative;flex:1 1 260px;max-width:440px}
.search svg{position:absolute;left:14px;top:13px;color:var(--mute)}
input,select,textarea{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);padding:10px 12px;font-size:16px}
textarea{line-height:1.5;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--tomato);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--tomato) 18%,transparent)}
.search input{padding-left:42px;border-radius:999px}
.tools select{width:auto;border-radius:999px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:thin}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip small{font-weight:600;color:var(--mute)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}.chip.on small{color:inherit;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:22px}
.card{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;text-decoration:none;box-shadow:var(--shadow);transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.ph{position:relative;aspect-ratio:4/3;background:color-mix(in srgb,var(--c) 22%,var(--soft));overflow:hidden}
.ph>img{width:100%;height:100%;object-fit:cover;display:block}
.noph{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--c) 30%,#fff) 0 38%,color-mix(in srgb,var(--c) 70%,#fff) 39%)}
.noph img{width:44%;aspect-ratio:1;border-radius:50%;background:#fff;padding:4px;box-shadow:0 8px 20px rgb(0 0 0/.15)}
.cat{position:absolute;left:12px;top:12px;background:var(--c);color:#fff;font-weight:800;font-size:13px;padding:4px 10px;border-radius:999px;box-shadow:0 2px 8px rgb(0 0 0/.2)}
.favd{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--tomato);display:grid;place-items:center}
.favd svg{fill:currentColor}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb h3{font-size:21px}
.cb p{margin:0;color:var(--mute);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{margin-top:auto;padding-top:8px;display:flex;gap:12px;flex-wrap:wrap;font-size:14px;font-weight:700;color:var(--mute)}
.meta span{display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;border:2px dashed var(--line);border-radius:22px}
.empty img{width:120px;border-radius:50%;margin-bottom:10px}
.empty h3{font-size:26px;margin-bottom:6px}.empty p{color:var(--mute);margin:0 0 16px}
/* recipe */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-decoration:none;color:var(--mute);margin-bottom:16px;min-height:44px}
.rhead{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:start}
.rphoto{border-radius:24px;aspect-ratio:4/3;box-shadow:var(--shadow)}
.rinfo h1{font-size:clamp(34px,4.6vw,52px);margin:2px 0 10px}
.rinfo .lede{margin:0 0 18px;color:var(--mute);max-width:none}
.red{color:var(--tomato-d)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--paper)}
.fact{padding:12px 14px;border-right:1px solid var(--line)}.fact:last-child{border:0}
.fact span{display:block;font-size:13px;color:var(--mute);font-weight:700}.fact b{font:800 20px/1.2 Fraunces,serif;white-space:nowrap}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:var(--soft);cursor:pointer;font-weight:800}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tag{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--basil) 14%,transparent);color:var(--basil)}
.ractions{display:flex;gap:8px;flex-wrap:wrap}
.ractions .on svg{fill:currentColor;color:var(--tomato)}
.rbody{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:clamp(20px,4vw,48px);margin-top:clamp(28px,4vw,48px)}
.box{background:var(--soft);border-radius:22px;padding:20px;margin-bottom:18px}
.box h2,.col-steps>h2{font-size:26px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.box h2 small{font:700 13px "Nunito Sans";color:var(--mute);margin-left:auto}
.ing,.eq{list-style:none;margin:0;padding:0}
.ing li{border-bottom:1px dashed var(--line)}.ing li:last-child{border:0}
.ing label{display:flex;gap:10px;align-items:flex-start;padding:9px 0;cursor:pointer}
.ing input{width:22px;height:22px;min-height:0;margin:1px 0 0;accent-color:var(--basil);flex:none}
.ing input:checked+span{text-decoration:line-through;opacity:.5}
.ing b{color:var(--tomato-d)}
.ing .grp{font:800 15px Fraunces,serif;padding:14px 0 4px;color:var(--basil);border:0}
.eq li{display:flex;gap:10px;align-items:center;padding:7px 0}
.eq li::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--pasta);flex:none}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.steps .n{width:44px;height:44px;border-radius:50%;background:var(--tomato);color:#fff;display:grid;place-items:center;font:800 19px Fraunces,serif}
.steps p{margin:8px 0 0;font-size:17px;max-width:68ch}
.tbtn{margin-top:10px;min-height:38px;font-size:14px;color:var(--basil);border-color:color-mix(in srgb,var(--basil) 40%,transparent)}
.tip{margin-top:24px;padding:20px 22px;border-radius:20px;background:color-mix(in srgb,var(--pasta) 20%,var(--paper));border:1px solid color-mix(in srgb,var(--pasta) 50%,transparent)}
.tip h3{font-size:20px;margin-bottom:6px}.tip p{margin:0;white-space:pre-line}
.src{margin-top:18px;color:var(--mute);font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.src a{color:var(--tomato-d);font-weight:700;overflow-wrap:anywhere}
@media(max-width:860px){.rhead,.rbody{grid-template-columns:minmax(0,1fr)}}
@media(max-width:520px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.fact:nth-child(2){border-right:0}.fact:nth-child(-n+2){border-bottom:1px solid var(--line)}}
/* editor */
.ed h1{font-size:clamp(32px,4vw,44px);margin-bottom:8px}
.note{background:color-mix(in srgb,var(--basil) 12%,transparent);color:var(--basil);border-radius:12px;padding:10px 14px;font-weight:700;margin:8px 0 0}
.form{display:grid;gap:18px;margin-top:20px}
.form label{display:grid;gap:6px;font-weight:800;font-size:15px}
.form label small{font-weight:600;color:var(--mute)}
.ed-grid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:24px}
.ed-main{display:grid;gap:14px;align-content:start}
.drop{aspect-ratio:4/3;border-radius:20px;border:2px dashed var(--line);display:grid;place-items:center;overflow:hidden;background:var(--soft);color:var(--mute);text-align:center;padding:0;margin-bottom:10px;cursor:pointer}
.drop img{width:100%;height:100%;object-fit:cover}
.drop.over{border-color:var(--tomato)}
.ed-photo .row{display:flex;gap:8px;flex-wrap:wrap}
.r4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.r2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ed-act{display:flex;gap:10px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--bg);padding:12px 0;border-top:1px solid var(--line)}
@media(max-width:760px){.ed-grid,.r2{grid-template-columns:minmax(0,1fr)}.r4{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* import */
.imp h1{font-size:clamp(32px,4vw,44px)}
.imp>.wrap>p{color:var(--mute);max-width:70ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:14px;margin:22px 0}
.tile{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:20px;padding:18px;cursor:pointer;display:grid;gap:6px;box-shadow:var(--shadow)}
.tile .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--k);color:#fff;margin-bottom:6px}
.tile .ico svg{width:24px;height:24px}
.tile b{font:800 19px Fraunces,serif}.tile span{color:var(--mute);font-size:14px}
.tile.on{border-color:var(--k);box-shadow:0 0 0 3px color-mix(in srgb,var(--k) 25%,transparent)}
.panel{background:var(--soft);border-radius:24px;padding:clamp(18px,3vw,30px);display:grid;gap:14px}
.panel h2{font-size:26px}.panel p{margin:0;color:var(--mute)}
.panel label{display:grid;gap:6px;font-weight:800;font-size:15px}
.howto{font-size:14px;color:var(--mute);background:var(--paper);border-radius:14px;padding:12px 14px;border:1px solid var(--line)}
.howto ol{margin:6px 0 0;padding-left:20px}
.status{display:flex;gap:12px;align-items:center;font-weight:700}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--tomato);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.found{display:grid;gap:8px}
.found label{display:flex;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700}
.found input{width:20px;height:20px;min-height:0;accent-color:var(--basil)}
.found small{color:var(--mute);font-weight:600}
.warn{color:var(--tomato-d);font-weight:700}
/* cook mode */
.cook{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.ck-top{display:flex;align-items:center;gap:12px;padding:12px max(4vw,16px);border-bottom:1px solid var(--line)}
.ck-top b{font:800 20px Fraunces,serif;margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck-top span{color:var(--mute);font-weight:700;white-space:nowrap}
.ck-bar{height:6px;background:var(--soft)}.ck-bar i{display:block;height:100%;background:var(--tomato);transition:width .3s}
.ck-main{flex:1;overflow:auto;padding:clamp(20px,5vw,60px) max(6vw,18px);display:flex;flex-direction:column;justify-content:center;max-width:1000px;margin:0 auto;width:100%}
.ck-n{font:400 64px/1 Lobster,cursive;color:var(--tomato)}
.ck-main p{font-size:clamp(22px,3.2vw,34px);line-height:1.4;margin:12px 0 18px;font-weight:600}
.ck-ing{padding:0 max(6vw,18px);max-width:1000px;margin:0 auto;width:100%}
.ck-ing summary{cursor:pointer;font-weight:800;min-height:44px;display:flex;align-items:center}
.ck-ing ul{columns:2 240px;margin:0 0 12px;padding-left:20px}
.ck-nav{display:flex;gap:12px;padding:14px max(4vw,16px);border-top:1px solid var(--line)}
.ck-nav .btn{flex:1;min-height:56px;font-size:17px}
/* timers, toast, modal */
#timers{position:fixed;right:16px;bottom:16px;z-index:70;display:grid;gap:8px}
.tmr{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 8px 8px 14px;box-shadow:var(--shadow);font-weight:700;font-size:14px}
.tmr b{font:800 20px Fraunces,serif;font-variant-numeric:tabular-nums}
.tmr.done{background:var(--tomato);color:#fff;animation:pulse 1s infinite}
.tmr button{border:0;background:rgb(255 255 255/.15);color:inherit;border-radius:10px;min-height:36px;padding:0 10px;cursor:pointer;font-weight:700}
@keyframes pulse{50%{transform:scale(1.04)}}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;transition:.25s;z-index:80;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;max-width:min(92vw,520px);pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:90;background:rgb(20 10 5/.5);display:grid;place-items:center;padding:16px}
.modal>div{background:var(--paper);border-radius:22px;padding:24px;max-width:520px;width:100%;display:grid;gap:14px;box-shadow:0 30px 80px rgb(0 0 0/.3)}
.modal h3{font-size:24px}.modal p{margin:0;color:var(--mute)}
.modal .act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
footer{text-align:center;color:var(--mute);font-size:14px;padding:30px 16px 40px}
footer img{width:46px;border-radius:50%;display:block;margin:0 auto 6px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="#"><img src="mascote-mini.jpg" alt=""><b>Matarello</b></a>
  <nav>
    <a class="btn" href="#importar"><svg class="i" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg><span>Importar</span></a>
    <a class="btn red" href="#nova"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Nova receita</span></a>
  </nav>
</div></header>
<main id="app"></main>
<footer><img src="mascote-mini.jpg" alt="">Matarello · il quaderno di ricette<br><span id="mode"></span></footer>
<div id="timers"></div>
<div id="toast" role="status"></div>
<script>
{
const $=s=>document.querySelector(s);
const app=$('#app');

/* ---------- toast, modal ---------- */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3200)}
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div role="dialog" aria-modal="true">${html}</div>`;document.body.append(m);m.addEventListener('click',e=>{if(e.target===m)m.remove()});return m}
function ask(title,msg,ok){return new Promise(res=>{const m=modal(`<h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="act"><button class="btn" data-a="0">Cancelar</button><button class="btn red" data-a="1">${esc(ok)}</button></div>`);m.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{m.remove();res(b.dataset.a==='1')})})}

/* ---------- storage ---------- */
const LS='matarello.v1';
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('matarello',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbGet(k){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbSet(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function lsLoad(){try{const v=await idbGet('recipes');if(Array.isArray(v))return v}catch(e){}try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return[]}}
function lsSave(){idbSet('recipes',JSON.parse(JSON.stringify(S.recipes))).catch(()=>{try{localStorage.setItem(LS,JSON.stringify(S.recipes))}catch(e){toast('Sem espaço para salvar neste navegador')}})}
async function saveFile(name,data,type){if(S.dl)return S.dl.save({filename:name,data});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
/* IA: Claude dentro do claude.ai, ou API da Anthropic com a chave do usuário no site */
const KEY='matarello.apikey',MODEL='matarello.model';
const getKey=()=>{try{return localStorage.getItem(KEY)||''}catch(e){return''}};
const getModel=()=>{try{return localStorage.getItem(MODEL)||'claude-sonnet-5-5'}catch(e){return'claude-sonnet-5-5'}};
const aiReady=()=>!!(S.sample||getKey());
async function aiMaxImages(){if(S.sample){const l=await S.sample.limits().catch(()=>null);return l?.images?.maxCount||0}return getKey()?8:0}
function parseJson(t){try{return JSON.parse(t)}catch(e){}const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){try{return JSON.parse(f[1])}catch(e){}}const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}throw{code:'invalid_json'}}
async function aiJson(prompt,images,signal){
 if(S.sample)return S.sample.json(prompt,{signal,images:images.length?images:undefined,modelTier:'default'});
 const content=[];for(const b of images){const c=await toCanvas(b,1568);content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:c.toDataURL('image/jpeg',.85).split(',')[1]}})}
 content.push({type:'text',text:prompt});
 let r;try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal,headers:{'content-type':'application/json','x-api-key':getKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:getModel(),max_tokens:16000,messages:[{role:'user',content}]})})}
 catch(e){if(e.name==='AbortError')throw{code:'cancelled'};throw{msg:'Sem conexão com a API da Anthropic.'}}
 if(!r.ok){let m='';try{m=(await r.json()).error?.message||''}catch(e){}throw{msg:r.status===401?'Chave da API inválida. Confira em Configurar IA.':r.status===429?'Limite da API atingido. Tente em instantes.':r.status===404?'Modelo não encontrado. Ajuste o modelo em Configurar IA.':'Erro da API ('+r.status+') '+m}}
 const j=await r.json();return parseJson((j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join(''))}
function aiSettings(){const m=modal(`<h3>Configurar IA</h3><p>Para importar e criar receitas neste site, o Matarello usa a API da Anthropic com a sua chave. Ela fica guardada só neste navegador e cada leitura é cobrada na sua conta da API. Crie a chave em console.anthropic.com › API Keys.</p>
 <label style="display:grid;gap:6px;font-weight:800">Chave da API<input id="ak" type="password" value="${esc(getKey())}" placeholder="sk-ant-…" autocomplete="off"></label>
 <label style="display:grid;gap:6px;font-weight:800">Modelo<input id="am" value="${esc(getModel())}"></label>
 <div class="act"><button class="btn quiet" data-clr>Apagar chave</button><button class="btn" data-x>Cancelar</button><button class="btn red" data-ok>Salvar</button></div>`);
 m.querySelector('[data-x]').onclick=()=>m.remove();
 m.querySelector('[data-clr]').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}m.remove();toast('Chave apagada');if(S.view==='import')renderImport()};
 m.querySelector('[data-ok]').onclick=()=>{try{localStorage.setItem(KEY,m.querySelector('#ak').value.trim());localStorage.setItem(MODEL,m.querySelector('#am').value.trim()||'claude-sonnet-5-5')}catch(e){toast('Não foi possível guardar a chave')}m.remove();toast('IA configurada');if(S.view==='import')renderImport()}}
function normalize(r,keepId){r=r||{};const cat=CATS.some(c=>c[0]===r.category)?r.category:'altro';
 const id=keepId&&/^[a-z0-9-]{3,40}$/i.test(r.id||'')?r.id:uid();
 return{id,title:String(r.title||'Receita sem nome').slice(0,140),subtitle:String(r.subtitle||'').slice(0,300),category:cat,servings:Math.max(1,n0(r.servings)||4),prepMin:n0(r.prepMin),cookMin:n0(r.cookMin),difficulty:['Fácil','Média','Difícil'].includes(r.difficulty)?r.difficulty:'Média',ingredients:arr(r.ingredients),equipment:arr(r.equipment),steps:arr(r.steps),notes:String(r.notes||''),tags:arr(Array.isArray(r.tags)?r.tags:String(r.tags||'').split(',')).slice(0,12),photo:safeImg(r.photo),sourceUrl:String(r.sourceUrl||''),sourceLabel:String(r.sourceLabel||''),favorite:!!r.favorite,createdAt:r.createdAt||Date.now(),updatedAt:r.updatedAt||Date.now()}}
async function persist(r){r.updatedAt=Date.now();const i=S.recipes.findIndex(x=>x.id===r.id);if(i>=0)S.recipes[i]=r;else S.recipes.unshift(r);
 if(S.mode==='db'){try{await S.db.collection('recipes').doc(r.id).set(JSON.parse(JSON.stringify(r)))}catch(e){dbErr(e);throw e}}else lsSave()}
async function remove(id){S.recipes=S.recipes.filter(x=>x.id!==id);if(S.mode==='db'){try{await S.db.collection('recipes').doc(id).delete()}catch(e){dbErr(e)}}else lsSave()}
function dbErr(e){const c=e&&e.code;toast(c==='quota_exceeded'?'O caderno atingiu o limite de armazenamento.':c==='invalid_argument'?'Não foi possível salvar (acesso só de leitura ou foto grande demais).':'Não foi possível salvar agora. Tente de novo.')}

/* ---------- ingredients ---------- */
const FR={'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3};
function num(s){s=s.trim();if(FR[s])return FR[s];if(s.includes('/')){let t=0;for(const x of s.split(/\s+/)){if(x.includes('/')){const[a,b]=x.split('/');t+=(+a)/(+b||1)}else t+=+x}return t}return parseFloat(s.replace(',','.'))}
function parseIng(l){const m=l.match(/^\s*(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?|[½¼¾⅓⅔])(?:\s*(?:a|-|–)\s*(\d+(?:[.,]\d+)?)(?=\s))?\s*(.*)$/);if(!m)return{q:null,rest:l};return{q:num(m[1]),q2:m[2]?num(m[2]):null,rest:m[3]}}
function fq(q){if(q==null||!isFinite(q))return'';const r=Math.round(q*100)/100,w=Math.floor(r),d=Math.round((r-w)*100)/100,F={.25:'¼',.5:'½',.75:'¾',.33:'⅓',.67:'⅔'};if(F[d]&&r<20)return(w?w+' ':'')+F[d];return(r>=20?Math.round(r):r).toString().replace('.',',')}
function scaled(l,f){const p=parseIng(l);if(p.q==null)return{q:'',rest:l};return{q:fq(p.q*f)+(p.q2!=null?' a '+fq(p.q2*f):''),rest:p.rest}}
const isGrp=l=>/:\s*$/.test(l)&&l.length<70;
function stepTime(s){const h=s.match(/(\d+(?:[.,]\d+)?)\s*(?:a\s*\d+\s*)?(?:h|horas?)\b/i),m=s.match(/(\d+)\s*(?:a\s*\d+\s*)?(?:min|minutos?)\b/i);let t=0;if(h)t+=parseFloat(h[1].replace(',','.'))*60;if(m)t+=+m[1];return t>0&&t<=24*60?Math.round(t):0}

/* ---------- router ---------- */
function route(soft){const h=decodeURIComponent(location.hash.slice(1));let v='home',id=null;
 if(h.startsWith('receita-')){v='recipe';id=h.slice(8)}else if(h.startsWith('editar-')){v='edit';id=h.slice(7)}else if(h==='nova'){v='edit'}else if(h==='importar'){v='import'}
 if(soft&&!(v==='home'||v==='recipe')||soft&&v!==S.view)return;
 S.view=v;({home:renderHome,recipe:renderRecipe,edit:renderEdit,import:renderImport})[v](id);if(!soft)window.scrollTo(0,0)}
addEventListener('hashchange',()=>route());
const go=h=>{if(location.hash.slice(1)===h)route();else location.hash=h};

function filtered(){const q=S.q.trim().toLowerCase();let l=S.recipes.filter(r=>(!S.cat||r.category===S.cat)&&(!S.fav||r.favorite)&&(!q||[r.title,r.subtitle,...(r.ingredients||[]),...(r.tags||[])].join(' ').toLowerCase().includes(q)));
 const tot=r=>n0(r.prepMin)+n0(r.cookMin);
 if(S.sort==='az')l.sort((a,b)=>a.title.localeCompare(b.title,'pt'));else if(S.sort==='fast')l.sort((a,b)=>(tot(a)||1e9)-(tot(b)||1e9));else l.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));return l}

let AC,tick;const timers=[];
function beep(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.25,AC.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d+.3);o.start(AC.currentTime+d);o.stop(AC.currentTime+d+.32)})}catch(e){}}
function startTimer(label,min){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}timers.push({id:uid(),label,end:Date.now()+min*60000});drawTimers();toast('Cronômetro de '+fmtMin(min)+' iniciado');if(!tick)tick=setInterval(drawTimers,1000)}
function drawTimers(){const now=Date.now();$('#timers').innerHTML=timers.map(t=>{const rem=t.end-now;if(rem<=0&&!t.done){t.done=true;beep();toast('Tempo! '+t.label)}const s=Math.max(0,Math.round(rem/1000));return`<div class="tmr ${t.done?'done':''}"><div><div style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.label)}</div><b>${t.done?'Pronto!':String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}</b></div><button data-tx="${t.id}">${t.done?'OK':'Parar'}</button></div>`}).join('');
 $('#timers').querySelectorAll('[data-tx]').forEach(b=>b.onclick=()=>{const i=timers.findIndex(t=>t.id===b.dataset.tx);if(i>=0)timers.splice(i,1);drawTimers()});
 if(!timers.length){clearInterval(tick);tick=null}}

 const key=e=>{if(e.key==='ArrowRight'&&i<st.length-1){i++;draw()}else if(e.key==='ArrowLeft'&&i>0){i--;draw()}else if(e.key==='Escape')close()};addEventListener('keydown',key);

async function storePhoto(blob){const c=await toCanvas(blob,1200);if(!S.db)return c.toDataURL('image/jpeg',.8);if(S.assets){try{const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));const a=await S.assets.upload(b);return a.url||('/_blob/'+a.id)}catch(e){}}

  const s=Math.min(1,900/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');c.width=Math.round(v.videoWidth*s);c.height=Math.round(v.videoHeight*s);c.getContext('2d').drawImage(v,0,0,c.width,c.height);out.push(await new Promise(r=>c.toBlob(r,'image/jpeg',.82)))}
 URL.revokeObjectURL(url);return out}
async function startImport(){if(!aiReady()){aiSettings();return}
 const go=$('#go'),stop=$('#stop');const val=s=>($(s)?.value||'').trim();
 const maxImg=await aiMaxImages();
 let material='',images=[],task='Extraia as receitas do material.',from='',url=val('#url'),cover=null;
 const which=val('#which');if(which)task+=` Traga apenas a receita que corresponde a: "${which}".`;
 try{go.disabled=true;stop.hidden=false;
  if(impTab==='pdf'){const f=$('#file').files[0];if(!f)throw{msg:'Escolha um arquivo PDF.'};from='PDF · '+f.name;const r=await readPdf(f,Math.min(maxImg,6));material=r.text;if(r.imgs.length){if(!maxImg)throw{msg:'Este PDF parece escaneado e o envio de imagens não está disponível aqui.'};images=r.imgs;task+=' O PDF é escaneado: leia as imagens das páginas.'}}
  else if(impTab==='video'){material=val('#txt');from=url?'vídeo · '+url:'vídeo';const fs=[...($('#file').files||[])];
   for(const f of fs){if(/^video\//.test(f.type)){status(`<div class="status"><span class="spin"></span>Extraindo quadros do vídeo…</div>`);try{const fr=await videoFrames(f,Math.min(6,Math.max(maxImg-images.length,0)));images.push(...fr);cover=fr[Math.floor(fr.length/2)]||null}catch(e){toast('Não consegui abrir o vídeo; seguindo com o resto')}}else if(/^image\//.test(f.type))images.push(f)}
   if(!material&&!images.length)throw{msg:'Cole a legenda ou envie o vídeo ou prints.'};
   task='Extraia a receita deste vídeo de culinária a partir da legenda e dos quadros/prints (leia o texto que aparece na tela). Se faltar quantidade, estime e avise em "notes".'+(which?` Receita: "${which}".`:'')}
  else if(impTab==='photo'){images=[...($('#file').files||[])].filter(f=>/^image\//.test(f.type));if(!images.length)throw{msg:'Escolha pelo menos uma imagem.'};from='foto';task+=' Leia o texto das imagens (pode ser manuscrito). Ignore fotos que não sejam texto.'}
  else if(impTab==='text'){material=val('#txt');if(!material)throw{msg:'Cole o texto da receita.'};from=url?'site · '+url:'texto colado'}
  else if(impTab==='spark'){const t=val('#txt');if(!t)throw{msg:'Escreva o que você quer cozinhar.'};task='Crie UMA receita original, testável e bem detalhada, de inspiração italiana quando fizer sentido, para este pedido: '+t;from='criação com IA'}
  if(images.length){if(!maxImg)throw{msg:'O envio de imagens não está disponível nesta visualização.'};images=images.slice(0,maxImg)}
  status(`<div class="status"><span class="spin"></span>O Claude está lendo e organizando a receita… isso pode levar até um minuto.</div>`);
  ctl=new AbortController();
  const j=await aiJson(buildPrompt(task,material),images,ctl.signal);
  const list=(Array.isArray(j)?j:(j&&j.recipes)||[]).map(r=>{const n=normalize(r);if(url&&/^https?:\/\//.test(url)){n.sourceUrl=url;n.sourceLabel=n.sourceLabel||(url.includes('instagram')?'Instagram':url.includes('tiktok')?'TikTok':url.includes('youtu')?'YouTube':'Site')}return n});
  status('');showFound(list,from,cover)}
 catch(e){status('');const c=e?.code;if(c!=='cancelled')toast(e?.msg||(c==='not_granted'?'Permissão para usar o Claude foi negada.':c==='rate_limited'?'Muitas leituras seguidas. Tente em alguns minutos.':c==='invalid_json'?'Não consegui organizar a resposta. Tente de novo.':c==='image_rejected'?'Uma das imagens não pôde ser lida.':c==='prompt_too_large'?'Material grande demais; indique qual receita ou envie menos páginas.':'Não foi possível ler agora. Tente de novo.'))}
 finally{go.disabled=false;stop.hidden=true;ctl=null}}
function showFound(list,from,cover){const box=$('#result');
 if(!list.length){box.innerHTML=`<div class="empty"><h3>Nenhuma receita encontrada</h3><p>Tente enviar outro material ou mais detalhes.</p></div>`;return}
 if(list.length===1){S.draft={...list[0],_from:from,_photoBlob:cover};go('nova');return}
 box.innerHTML=`<div class="panel"><h2>${list.length} receitas encontradas</h2><p>Marque as que quer salvar, ou abra uma para revisar antes.</p><div class="found">${list.map((r,i)=>`<label><input type="checkbox" data-i="${i}" checked><span>${esc(r.title)}<br><small>${esc(catOf(r.category)[2])} · ${r.ingredients.length} ingredientes · ${r.steps.length} passos</small></span><button type="button" class="btn quiet" data-rev="${i}" style="margin-left:auto">Revisar</button></label>`).join('')}</div><div class="hero-act" style="justify-content:flex-start"><button class="btn red" id="saveall">Salvar selecionadas</button></div></div>`;
 box.querySelectorAll('[data-rev]').forEach(b=>b.onclick=e=>{e.preventDefault();S.draft={...list[+b.dataset.rev],_from:from};go('nova')});
 $('#saveall').onclick=()=>saveMany([...box.querySelectorAll('[data-i]:checked')].map(c=>list[+c.dataset.i]))}
async function saveMany(list){if(!list.length){toast('Nada para salvar');return}let ok=0;for(const r of list){try{await persist(r);ok++}catch(e){break}}toast(`${ok} receita${ok>1?'s':''} salva${ok>1?'s':''}`);if(ok)go('')}

/* ---------- printable sheet ---------- */
async function downloadSheet(r,sv,f){let ph=safeImg(r.photo);
 if(ph&&!ph.startsWith('data:')){try{const b=await (await fetch(ph)).blob();ph=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b)})}catch(e){ph=''}}
 const ing=(r.ingredients||[]).map(l=>isGrp(l)?`<li class="g">${esc(l)}</li>`:(s=>`<li><b>${esc(s.q)}</b> ${esc(s.rest)}</li>`)(scaled(l,f))).join('');
 const html=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(r.title)} · Matarello</title><style>body{font:15px/1.5 Georgia,serif;color:#2b1d18;max-width:860px;margin:0 auto;padding:28px}h1{font-size:34px;margin:4px 0}.k{color:#d63a2c;font:700 13px sans-serif}.bar{height:8px;background:linear-gradient(90deg,#2f8a4b 0 33%,#fff 33% 66%,#d63a2c 66%);border:1px solid #eee;margin-bottom:18px}img{width:100%;max-height:380px;object-fit:cover;border-radius:14px}.f{display:flex;gap:24px;font:600 14px sans-serif;margin:12px 0;flex-wrap:wrap}.c{display:grid;grid-template-columns:260px 1fr;gap:28px}ul{padding-left:18px}li{margin:4px 0}.g{list-style:none;margin-left:-18px;font-weight:700;color:#2f8a4b}ol li{margin-bottom:10px}b{color:#a92a1f}.t{background:#fdf1d8;padding:12px 16px;border-radius:10px}@media(max-width:640px){.c{grid-template-columns:1fr}}@media print{body{padding:0}}</style></head><body><div class="bar"></div><p class="k">MATARELLO · ${esc(catOf(r.category)[1])}</p><h1>${esc(r.title)}</h1><p>${esc(r.subtitle)}</p>${ph?`<img src="${ph}" alt="">`:''}<div class="f"><span>Preparo: ${fmtMin(r.prepMin)}</span><span>Cozimento: ${fmtMin(r.cookMin)}</span><span>Porções: ${sv}</span><span>Dificuldade: ${esc(r.difficulty)}</span></div><div class="c"><div><h2>Ingredientes</h2><ul>${ing}</ul><h2>Equipamentos</h2><ul>${(r.equipment||[]).map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div><div><h2>Modo de preparo</h2><ol>${(r.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${r.notes?`<div class="t"><b>Dica do chef:</b> ${esc(r.notes)}</div>`:''}${r.sourceUrl||r.sourceLabel?`<p>Fonte: ${esc(r.sourceLabel)} ${esc(r.sourceUrl)}</p>`:''}</div></div></body></html>`;
 const name=r.title.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'receita';
 try{await saveFile(name+'.html',html,'text/html');toast('Ficha salva: abra no navegador para imprimir ou gerar PDF')}catch(e){if(e?.code!=='declined')toast('Não foi possível baixar a ficha')}}

/* ---------- boot ---------- */
route();
const use=n=>window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
(async()=>{const local=(await lsLoad()).map(r=>normalize(r,true));
 if(!window.claude){S.recipes=local;S.ready=true;$('#mode').textContent='Receitas guardadas neste aparelho · faça backup em Importar › Backup';try{navigator.storage?.persist?.()}catch(e){}route();return}
 S.recipes=local;route(true);
 const[db,assets,sample,dl]=await Promise.all(['db','assets','sample','downloads'].map(use));
 S.assets=assets;S.sample=sample;S.dl=dl;
 if(db){S.db=db;S.mode='db';$('#mode').textContent='Caderno salvo na nuvem';let first=true;
  const t=setTimeout(()=>{if(!S.ready){S.ready=true;route(true);toast('Não consegui abrir o caderno ainda. Verifique a conexão.')}},10000);
  db.collection('recipes').onSnapshot(snap=>{S.recipes=snap.docs.map(d=>normalize({...d.data(),id:d.id},true));if(!snap.metadata.fromCache)clearTimeout(t);S.ready=true;if(first){first=false;route()}else route(true)},err=>{clearTimeout(t);S.ready=true;toast('O caderno não pôde ser carregado.');route(true)})}
 else{S.ready=true;$('#mode').textContent='Receitas guardadas neste aparelho';route()}})();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!window.claude)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
