<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matarello</title>
<meta name="description" content="Matarello – caderno de receitas com foto, ingredientes, equipamentos e passo a passo, com importação de PDF, vídeo, foto e texto.">
<meta name="theme-color" content="#d63a2c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
/* VOICE: caloroso como uma trattoria, organizado como um caderno profissional de cozinha
   IDEA: um caderno de receitas italiano com capa de toalha xadrez e lombada tricolor
   PICTURE: o mascote chef num medalhão sobre a toalha vermelha; fichas com foto grande
   COLOUR and TYPE: tomate #d63a2c, manjericão #2f8a4b, massa #f2b441 sobre branco; Lobster no nome, Fraunces nos títulos, Nunito Sans no texto
   LAYOUT: capa centralizada, grade de fichas, ficha da receita com ingredientes ao lado do preparo */
:root{color-scheme:light dark;--fs:1;
--bg:light-dark(#ffffff,#17110f);--paper:light-dark(#ffffff,#221a16);--soft:light-dark(#f6f2ef,#2b211c);
--ink:light-dark(#2b1d18,#f7eee8);--mute:light-dark(#6e5c54,#bfaba1);--line:light-dark(#ece2dc,#3b2e28);
--tomato:#d63a2c;--tomato-d:light-dark(#a92a1f,#ff7a6b);--basil:light-dark(#2f8a4b,#62c682);--pasta:#f2b441;
--shadow:0 1px 2px rgb(60 20 10/.06),0 10px 30px rgb(80 30 20/.09)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:calc(16px*var(--fs))/1.55 "Nunito Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:800;line-height:1.08;text-wrap:balance;margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.band{padding:clamp(24px,4vw,56px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding:10px max(5vw,16px);max-width:calc(1240px + 10vw)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{width:42px;height:42px;border-radius:50%;border:2px solid var(--tomato);background:#fff}
.logo b{font:400 calc(28px*var(--fs))/1 Lobster,cursive;color:var(--tomato)}
.top nav{margin-left:auto;display:flex;gap:8px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-weight:700;font-size:calc(15px*var(--fs));cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--tomato);color:var(--tomato-d)}
.btn.red{background:var(--tomato);border-color:var(--tomato);color:#fff}.btn.red:hover{background:#b92e22;color:#fff}
.btn.green{background:var(--basil);border-color:var(--basil);color:#fff}
.btn.light{background:#fff;color:#a92a1f;border-color:#fff}
.btn.ghost-l{background:transparent;color:#fff;border-color:rgb(255 255 255/.7)}.btn.ghost-l:hover{background:rgb(255 255 255/.12);color:#fff}
.btn.quiet{border-color:transparent;background:transparent;color:var(--mute)}
.btn:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:3px solid var(--pasta);outline-offset:2px}
@media(max-width:600px){.top nav .btn span{display:none}.top nav .btn{padding:0 13px}}
/* cover */
.hero{position:relative;color:#fff;text-align:center;background:
 repeating-linear-gradient(0deg,rgb(255 255 255/.10) 0 28px,transparent 28px 56px),
 repeating-linear-gradient(90deg,rgb(255 255 255/.10) 0 28px,transparent 28px 56px),var(--tomato)}
.medal{width:clamp(190px,30vw,300px);aspect-ratio:1;margin:0 auto;border-radius:50%;background:#fff;padding:8px;box-shadow:0 0 0 8px rgb(255 255 255/.25),0 20px 50px rgb(80 10 0/.35)}
.medal img{width:100%;height:100%;border-radius:50%;display:block}
.kicker{font-weight:800;font-size:calc(14px*var(--fs));margin:0 0 6px;letter-spacing:.02em}
.brand{font:400 calc(clamp(58px,10vw,104px)*var(--fs))/1 Lobster,cursive;margin:18px 0 6px;text-shadow:0 3px 0 rgb(120 20 10/.35)}
.lede{font-size:calc(17px*var(--fs));max-width:62ch;margin:0 auto 20px;opacity:.95}
.hero-act{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.stats{display:flex;justify-content:center;gap:clamp(18px,5vw,56px);margin:26px 0 0;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column-reverse}.stats dt{font-size:calc(14px*var(--fs));opacity:.85}.stats dd{margin:0;font:800 calc(34px*var(--fs))/1 Fraunces,serif}
.tricolor{height:10px;background:linear-gradient(90deg,#2f8a4b 0 33.3%,#fff 33.3% 66.6%,#d63a2c 66.6%);border-bottom:1px solid var(--line)}
/* list */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools h2{font-size:calc(32px*var(--fs));margin-right:auto}
.search{position:relative;flex:1 1 260px;max-width:440px}
.search svg{position:absolute;left:14px;top:13px;color:var(--mute)}
input,select,textarea{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);padding:10px 12px;font-size:calc(16px*var(--fs))}
textarea{line-height:1.5;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--tomato);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--tomato) 18%,transparent)}
.search input{padding-left:42px;border-radius:999px}
.tools select{width:auto;border-radius:999px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:thin}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-weight:700;font-size:calc(14px*var(--fs));cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip small{font-weight:600;color:var(--mute)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}.chip.on small{color:inherit;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:22px}
.card{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;text-decoration:none;box-shadow:var(--shadow);transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.ph{position:relative;aspect-ratio:4/3;background:color-mix(in srgb,var(--c) 22%,var(--soft));overflow:hidden}
.ph>img{width:100%;height:100%;object-fit:cover;display:block}
.noph{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--c) 30%,#fff) 0 38%,color-mix(in srgb,var(--c) 70%,#fff) 39%)}
.noph img{width:44%;aspect-ratio:1;border-radius:50%;background:#fff;padding:4px;box-shadow:0 8px 20px rgb(0 0 0/.15)}
.cat{position:absolute;left:12px;top:12px;background:var(--c);color:#fff;font-weight:800;font-size:calc(13px*var(--fs));padding:4px 10px;border-radius:999px;box-shadow:0 2px 8px rgb(0 0 0/.2)}
.favd{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--tomato);display:grid;place-items:center}
.favd svg{fill:currentColor}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb h3{font-size:calc(21px*var(--fs))}
.cb p{margin:0;color:var(--mute);font-size:calc(15px*var(--fs));display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{margin-top:auto;padding-top:8px;display:flex;gap:12px;flex-wrap:wrap;font-size:calc(14px*var(--fs));font-weight:700;color:var(--mute)}
.meta span{display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;border:2px dashed var(--line);border-radius:22px}
.empty img{width:120px;border-radius:50%;margin-bottom:10px}
.empty h3{font-size:calc(26px*var(--fs));margin-bottom:6px}.empty p{color:var(--mute);margin:0 0 16px}
/* recipe */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-decoration:none;color:var(--mute);margin-bottom:16px;min-height:44px}
.rhead{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:start}
.rphoto{border-radius:24px;aspect-ratio:4/3;box-shadow:var(--shadow)}
.rinfo h1{font-size:calc(clamp(34px,4.6vw,52px)*var(--fs));margin:2px 0 10px}
.rinfo .lede{margin:0 0 18px;color:var(--mute);max-width:none}
.red{color:var(--tomato-d)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--paper)}
.fact{padding:12px 14px;border-right:1px solid var(--line)}.fact:last-child{border:0}
.fact span{display:block;font-size:calc(13px*var(--fs));color:var(--mute);font-weight:700}.fact b{font:800 calc(20px*var(--fs))/1.2 Fraunces,serif;white-space:nowrap}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:var(--soft);cursor:pointer;font-weight:800}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tag{font-size:calc(13px*var(--fs));font-weight:700;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--basil) 14%,transparent);color:var(--basil)}
.ractions{display:flex;gap:8px;flex-wrap:wrap}
.ractions .on svg{fill:currentColor;color:var(--tomato)}
.rbody{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:clamp(20px,4vw,48px);margin-top:clamp(28px,4vw,48px)}
.box{background:var(--soft);border-radius:22px;padding:20px;margin-bottom:18px}
.box h2,.col-steps>h2{font-size:calc(26px*var(--fs));margin-bottom:12px;display:flex;align-items:center;gap:10px}
.box h2 small{font:700 calc(13px*var(--fs)) "Nunito Sans";color:var(--mute);margin-left:auto}
.ing,.eq{list-style:none;margin:0;padding:0}
.ing li{border-bottom:1px dashed var(--line)}.ing li:last-child{border:0}
.ing label{display:flex;gap:10px;align-items:flex-start;padding:9px 0;cursor:pointer}
.ing input{width:22px;height:22px;min-height:0;margin:1px 0 0;accent-color:var(--basil);flex:none}
.ing input:checked+span{text-decoration:line-through;opacity:.5}
.ing b{color:var(--tomato-d)}
.ing .grp{font:800 calc(15px*var(--fs)) Fraunces,serif;padding:14px 0 4px;color:var(--basil);border:0}
.eq li{display:flex;gap:10px;align-items:center;padding:7px 0}
.eq li::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--pasta);flex:none}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.steps .n{width:44px;height:44px;border-radius:50%;background:var(--tomato);color:#fff;display:grid;place-items:center;font:800 calc(19px*var(--fs)) Fraunces,serif}
.steps p{margin:8px 0 0;font-size:calc(17px*var(--fs));max-width:68ch}
.tm{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;background:color-mix(in srgb,var(--basil) 14%,transparent);color:var(--basil);border:1px solid color-mix(in srgb,var(--basil) 35%,transparent);border-radius:9px;padding:0 7px;font-weight:800;line-height:1.6}
.tm svg{width:15px;height:15px}
.tmb{position:absolute;left:12px;bottom:12px;background:#1f5e34;color:#fff;font-weight:800;font-size:calc(12px*var(--fs));padding:3px 9px;border-radius:999px;display:inline-flex;gap:5px;align-items:center;box-shadow:0 2px 8px rgb(0 0 0/.2)}
.tmb svg{width:14px;height:14px}
.badge{display:inline-flex;gap:6px;align-items:center;font-weight:800;font-size:calc(14px*var(--fs));padding:4px 12px;border-radius:999px;background:#1f5e34;color:#fff;margin-bottom:10px}
.ckb{display:grid;gap:12px}
.ckb .blk{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.ckb .blk header{display:flex;align-items:center;gap:10px}.ckb .blk header b{flex:1}
.ckb pre{margin:0;white-space:pre-wrap;font:inherit;font-size:calc(15px*var(--fs));max-height:180px;overflow:auto;color:var(--ink)}
.ckb .cp{min-height:36px;font-size:calc(14px*var(--fs));padding:0 12px}
.ckb .stp{display:flex;gap:10px;align-items:flex-start;border-top:1px dashed var(--line);padding-top:8px}.ckb .stp span{flex:1}
.check{display:flex!important;align-items:center;gap:10px;font-weight:800}.check input{width:22px;height:22px;min-height:0;accent-color:var(--basil)}
.tbtn{margin-top:10px;min-height:38px;font-size:calc(14px*var(--fs));color:var(--basil);border-color:color-mix(in srgb,var(--basil) 40%,transparent)}
.tip{margin-top:24px;padding:20px 22px;border-radius:20px;background:color-mix(in srgb,var(--pasta) 20%,var(--paper));border:1px solid color-mix(in srgb,var(--pasta) 50%,transparent)}
.tip h3{font-size:calc(20px*var(--fs));margin-bottom:6px}.tip p{margin:0;white-space:pre-line}
.src{margin-top:18px;color:var(--mute);font-size:calc(15px*var(--fs));display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.src a{color:var(--tomato-d);font-weight:700;overflow-wrap:anywhere}
@media(max-width:860px){.rhead,.rbody{grid-template-columns:minmax(0,1fr)}}
@media(max-width:520px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.fact:nth-child(2){border-right:0}.fact:nth-child(-n+2){border-bottom:1px solid var(--line)}}
/* editor */
.ed h1{font-size:calc(clamp(32px,4vw,44px)*var(--fs));margin-bottom:8px}
.note{background:color-mix(in srgb,var(--basil) 12%,transparent);color:var(--basil);border-radius:12px;padding:10px 14px;font-weight:700;margin:8px 0 0}
.form{display:grid;gap:18px;margin-top:20px}
.form label{display:grid;gap:6px;font-weight:800;font-size:calc(15px*var(--fs))}
.form label small{font-weight:600;color:var(--mute)}
.ed-grid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:24px}
.ed-main{display:grid;gap:14px;align-content:start}
.drop{aspect-ratio:4/3;border-radius:20px;border:2px dashed var(--line);display:grid;place-items:center;overflow:hidden;background:var(--soft);color:var(--mute);text-align:center;padding:0;margin-bottom:10px;cursor:pointer}
.drop img{width:100%;height:100%;object-fit:cover}
.drop.over{border-color:var(--tomato)}
.ed-photo .row{display:flex;gap:8px;flex-wrap:wrap}
.r4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.r2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ed-act{display:flex;gap:10px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--bg);padding:12px 0;border-top:1px solid var(--line)}
@media(max-width:760px){.ed-grid,.r2{grid-template-columns:minmax(0,1fr)}.r4{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* import */
.imp h1{font-size:calc(clamp(32px,4vw,44px)*var(--fs))}
.imp>.wrap>p{color:var(--mute);max-width:70ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:14px;margin:22px 0}
.tile{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:20px;padding:18px;cursor:pointer;display:grid;gap:6px;box-shadow:var(--shadow)}
.tile .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--k);color:#fff;margin-bottom:6px}
.tile .ico svg{width:24px;height:24px}
.tile b{font:800 calc(19px*var(--fs)) Fraunces,serif}.tile span{color:var(--mute);font-size:calc(14px*var(--fs))}
.tile.on{border-color:var(--k);box-shadow:0 0 0 3px color-mix(in srgb,var(--k) 25%,transparent)}
.panel{background:var(--soft);border-radius:24px;padding:clamp(18px,3vw,30px);display:grid;gap:14px}
.panel h2{font-size:calc(26px*var(--fs))}.panel p{margin:0;color:var(--mute)}
.panel label{display:grid;gap:6px;font-weight:800;font-size:calc(15px*var(--fs))}
.howto{font-size:calc(14px*var(--fs));color:var(--mute);background:var(--paper);border-radius:14px;padding:12px 14px;border:1px solid var(--line)}
.howto ol{margin:6px 0 0;padding-left:20px}
.status{display:flex;gap:12px;align-items:center;font-weight:700}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--tomato);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.found{display:grid;gap:8px}
.found label{display:flex;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700}
.found input{width:20px;height:20px;min-height:0;accent-color:var(--basil)}
.found small{color:var(--mute);font-weight:600}
.warn{color:var(--tomato-d);font-weight:700}
/* cook mode */
.cook{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.ck-top{display:flex;align-items:center;gap:12px;padding:12px max(4vw,16px);border-bottom:1px solid var(--line)}
.ck-top b{font:800 calc(20px*var(--fs)) Fraunces,serif;margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck-top span{color:var(--mute);font-weight:700;white-space:nowrap}
.ck-bar{height:6px;background:var(--soft)}.ck-bar i{display:block;height:100%;background:var(--tomato);transition:width .3s}
.ck-main{flex:1;overflow:auto;padding:clamp(20px,5vw,60px) max(6vw,18px);display:flex;flex-direction:column;justify-content:center;max-width:1000px;margin:0 auto;width:100%}
.ck-n{font:400 calc(64px*var(--fs))/1 Lobster,cursive;color:var(--tomato)}
.ck-main p{font-size:calc(clamp(22px,3.2vw,34px)*var(--fs));line-height:1.4;margin:12px 0 18px;font-weight:600}
.ck-ing{padding:0 max(6vw,18px);max-width:1000px;margin:0 auto;width:100%}
.ck-ing summary{cursor:pointer;font-weight:800;min-height:44px;display:flex;align-items:center}
.ck-ing ul{columns:2 240px;margin:0 0 12px;padding-left:20px}
.ck-nav{display:flex;gap:12px;padding:14px max(4vw,16px);border-top:1px solid var(--line)}
.ck-nav .btn{flex:1;min-height:56px;font-size:calc(17px*var(--fs))}
/* timers, toast, modal */
#timers{position:fixed;right:16px;bottom:16px;z-index:70;display:grid;gap:8px}
.tmr{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 8px 8px 14px;box-shadow:var(--shadow);font-weight:700;font-size:calc(14px*var(--fs))}
.tmr b{font:800 calc(20px*var(--fs)) Fraunces,serif;font-variant-numeric:tabular-nums}
.tmr.done{background:var(--tomato);color:#fff;animation:pulse 1s infinite}
.tmr button{border:0;background:rgb(255 255 255/.15);color:inherit;border-radius:10px;min-height:36px;padding:0 10px;cursor:pointer;font-weight:700}
@keyframes pulse{50%{transform:scale(1.04)}}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;transition:.25s;z-index:80;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;max-width:min(92vw,520px);pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:90;background:rgb(20 10 5/.5);display:grid;place-items:center;padding:16px}
.modal>div{background:var(--paper);border-radius:22px;padding:24px;max-width:520px;width:100%;display:grid;gap:14px;box-shadow:0 30px 80px rgb(0 0 0/.3)}
.modal h3{font-size:calc(24px*var(--fs))}.modal p{margin:0;color:var(--mute)}
.modal .act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
footer{text-align:center;color:var(--mute);font-size:calc(14px*var(--fs));padding:30px 16px 40px}
footer img{width:46px;border-radius:50%;display:block;margin:0 auto 6px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* aparência: idioma, tema, letra, ajuda */
.ib{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);display:grid;place-items:center;cursor:pointer;font-weight:800;font-size:calc(17px*var(--fs));flex:none;padding:0}
.ib:hover{border-color:var(--tomato);color:var(--tomato-d)}
.ib.txt{font-size:calc(15px*var(--fs));letter-spacing:-.02em}
.flag{width:42px;height:42px;border-radius:50%;padding:0;border:2px solid transparent;background:var(--soft);display:grid;place-items:center;cursor:pointer;flex:none}
.flag svg{width:26px;height:18px;border-radius:3px;box-shadow:0 0 0 1px rgb(0 0 0/.15);display:block}
.flag[aria-pressed=false]{opacity:.5;filter:grayscale(.5)}
.flag[aria-pressed=true]{border-color:var(--tomato);background:var(--paper)}
.flag:hover{opacity:1;filter:none}
.sep{width:1px;height:28px;background:var(--line);flex:none;margin:0 2px}
.top nav{align-items:center;gap:6px}
.wide{display:contents}.narrow{display:none}
@media(max-width:900px){.wide{display:none}.narrow{display:grid}}
@media(max-width:520px){.logo b{display:none}.top .wrap{gap:6px}.top nav{gap:5px}}
.pop{position:fixed;right:max(5vw,16px);top:66px;z-index:40;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 20px 50px rgb(0 0 0/.2);display:grid;gap:14px;width:min(330px,calc(100vw - 32px))}
.pop h4{margin:0 0 6px;font-size:calc(14px*var(--fs));color:var(--mute)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-height:58px;flex-direction:column;padding:4px 6px;font-size:calc(14px*var(--fs));border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fsrow{display:flex;align-items:center;gap:10px}.fsrow b{flex:1;text-align:center;font-size:calc(18px*var(--fs))}
/* setas das categorias */
.chipsw{display:flex;align-items:flex-start;gap:6px}
.chipsw .chips{flex:1;scroll-behavior:smooth;scrollbar-width:none}
.chipsw .chips::-webkit-scrollbar{display:none}
.arr{display:none}
@media(min-width:700px) and (hover:hover){.arr{display:grid;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);place-items:center;cursor:pointer;flex:none;box-shadow:var(--shadow);margin-top:2px;padding:0}.arr:hover{border-color:var(--tomato);color:var(--tomato-d)}.arr[disabled]{opacity:.3;cursor:default;box-shadow:none}}
@media not ((min-width:700px) and (hover:hover)){.chipsw .chips{scrollbar-width:thin}}
/* ajuda */
.modal>div.help{max-width:760px;max-height:88vh;overflow:auto;gap:4px}
.help h3{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.help h3 img{width:48px;border-radius:50%}
.help section{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.help .hic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:var(--k)}
.help .hic svg{width:22px;height:22px}
.help h4{margin:0 0 4px;font:800 calc(18px*var(--fs)) Fraunces,serif}
.help p,.help li{margin:0;color:var(--ink);font-size:calc(15px*var(--fs))}
.help ul{margin:4px 0 0;padding-left:18px}
.help .act{position:sticky;bottom:-24px;background:var(--paper);padding:12px 0 0}
</style>
</head>

h1t:`Creare una ricetta`,h1:`Tocca <b>Nuova ricetta</b>, scegli una foto del piatto e compila nome, categoria, porzioni, tempi, ingredienti, attrezzatura e passaggi. Tocca <b>Salva ricetta</b>.`,
h2t:`Scrivere gli ingredienti`,h2:`<ul><li>Un ingrediente per riga, con la quantità davanti: <i>200 g di farina</i>, <i>1/2 tazza di zucchero</i>, <i>2 a 3 spicchi d'aglio</i>.</li><li>Una riga che termina con i due punti crea un gruppo: <i>Per il sugo:</i></li><li>Così, cambiando le porzioni, le quantità vengono ricalcolate.</li></ul>`,
h3t:`Consultare e cucinare`,h3:`<ul><li>Nella scheda usa <b>−</b> e <b>+</b> sulle porzioni per adattare le quantità.</li><li>Spunta gli ingredienti man mano che li prepari.</li><li>I tempi scritti nei passaggi, come <i>10 min</i> o <i>1 ora</i>, diventano pulsanti <b>timer</b> con allarme.</li><li>La <b>Modalità cucina</b> mostra un passaggio alla volta a caratteri grandi e tiene lo schermo acceso. Sul PC usa le frecce della tastiera.</li></ul>`,
h4t:`Importare ricette`,h4:`<ul><li><b>PDF</b>: libri e dispense, anche scansionati. Se ci sono più ricette, scegli quali salvare.</li><li><b>Video</b>: incolla il link e la didascalia di Instagram, TikTok o YouTube; se vuoi invia il video salvato o degli screenshot.</li><li><b>Foto o screenshot</b>: pagina di libro, quaderno scritto a mano, screenshot di un sito.</li><li><b>Testo o sito</b>: copia e incolla la ricetta.</li><li><b>Crea con l'IA</b>: di' cosa hai in casa.</li></ul>Controlla sempre la scheda prima di salvare. Sul sito, configura l'IA una volta con la tua chiave API di Anthropic (console.anthropic.com).`,
h5t:`Cercare e organizzare`,h5:`Cerca per nome, ingrediente o tag. Filtra per categoria (sul PC usa le frecce accanto all'elenco), mostra solo le preferite e ordina per più recenti, A–Z o più veloci.`,
h6t:`Lista della spesa e scheda`,h6:`<b>Lista della spesa</b> copia gli ingredienti già nella quantità scelta, da incollare su WhatsApp o nelle note. <b>Scarica scheda</b> crea un file da stampare o salvare in PDF dal browser.`,
h7t:`Backup e altri dispositivi`,h7:`Le ricette restano sul dispositivo che stai usando. In <b>Importa › Backup</b> esporta il quaderno ogni tanto e importa il file sull'altro dispositivo.`,
h8t:`Installare sul telefono`,h8:`<ul><li><b>iPhone</b>: in Safari tocca Condividi › Aggiungi alla schermata Home.</li><li><b>Android</b>: in Chrome apri il menu ⋮ › Installa app.</li></ul>Dopo la prima visita il Matarello si apre anche senza internet.`,
h9t:`Aspetto`,h9:`Le <b>bandiere</b> cambiano la lingua tra portoghese e italiano. Il pulsante <b>sole/luna</b> passa dal tema chiaro a quello scuro, e <b>A−</b> / <b>A+</b> riducono o ingrandiscono il testo. Sul telefono queste opzioni sono nel pulsante <b>Aa</b>.`,

async function idbGet(k){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbSet(k,v){const d=await idb();return new Promise((res,rej)=>{const x=d.transaction('kv','readwrite');x.objectStore('kv').put(v,k);x.oncomplete=()=>res();x.onerror=()=>rej(x.error)})}

function parseJson(s){try{return JSON.parse(s)}catch(e){}const f=s.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){try{return JSON.parse(f[1])}catch(e){}}const a=s.search(/[\[{]/),b=Math.max(s.lastIndexOf('}'),s.lastIndexOf(']'));if(a>=0&&b>a){try{return JSON.parse(s.slice(a,b+1))}catch(e){}}throw{code:'invalid_json'}}
async function aiJson(prompt,images,signal){
 if(S.sample)return S.sample.json(prompt,{signal,images:images.length?images:undefined,modelTier:'default'});

/* ---------- ingredientes ---------- */
const FR={'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3};
function num(s){s=s.trim();if(FR[s])return FR[s];if(s.includes('/')){let x=0;for(const p of s.split(/\s+/)){if(p.includes('/')){const[a,b]=p.split('/');x+=(+a)/(+b||1)}else x+=+p}return x}return parseFloat(s.replace(',','.'))}
function parseIng(l){const m=l.match(/^\s*(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?|[½¼¾⅓⅔])(?:\s*(?:a|-|–)\s*(\d+(?:[.,]\d+)?)(?=\s))?\s*(.*)$/);if(!m)return{q:null,rest:l};return{q:num(m[1]),q2:m[2]?num(m[2]):null,rest:m[3]}}
function fq(q){if(q==null||!isFinite(q))return'';const r=Math.round(q*100)/100,w=Math.floor(r),d=Math.round((r-w)*100)/100,F={.25:'¼',.5:'½',.75:'¾',.33:'⅓',.67:'⅔'};if(F[d]&&r<20)return(w?w+' ':'')+F[d];return(r>=20?Math.round(r):r).toString().replace('.',',')}
function scaled(l,f){const p=parseIng(l);if(p.q==null)return{q:'',rest:l};return{q:fq(p.q*f)+(p.q2!=null?' a '+fq(p.q2*f):''),rest:p.rest}}
const isGrp=l=>/:\s*$/.test(l)&&l.length<70;
const TMTOK=String.raw`(?:\d+(?:[.,]\d+)?\s*(?:seg|sec|s|min|h)\.?|\d{2,3}\s*°\s*C?|Varoma|⟲|colher inversa|sentido inverso|reverse|antiorario|vel(?:ocidade|ocità)?\.?\s*(?:colher|cucchiaio|soft|turbo|\d+(?:[.,]\d+)?(?:\s*[-–]\s*\d+(?:[.,]\d+)?)?)|turbo)`;
const TMRE=new RegExp(TMTOK+String.raw`(?:\s*\/\s*`+TMTOK+')*','gi');
function fmtStep(s){let out='',last=0;s=String(s);for(const m of s.matchAll(TMRE)){const v=m[0];if(!(/vel|varoma|turbo/i.test(v)||(/\//.test(v)&&/°|colher|antiorario|⟲|inverso/i.test(v))))continue;out+=esc(s.slice(last,m.index))+`<span class="tm">${ic('tm')}${esc(v)}</span>`;last=m.index+v.length}return out+esc(s.slice(last))}
const TMS=['any','TM31','TM5','TM6','TM7'];
const tmLabel=v=>v==='any'?t('tmName'):'Thermomix '+v;
function stepTime(s){const h=s.match(/(\d+(?:[.,]\d+)?)\s*(?:a\s*\d+\s*)?(?:h|horas?|ore|ora)\b/i),m=s.match(/(\d+)\s*(?:a\s*\d+\s*)?(?:min|minutos?|minuti|minuto)\b/i);let x=0;if(h)x+=parseFloat(h[1].replace(',','.'))*60;if(m)x+=+m[1];return x>0&&x<=24*60?Math.round(x):0}

let AC,tick;const timers=[];
function beep(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.25,AC.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d+.3);o.start(AC.currentTime+d);o.stop(AC.currentTime+d+.32)})}catch(e){}}
function startTimer(label,min){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}timers.push({id:uid(),label,end:Date.now()+min*60000});drawTimers();toast(t('started',{m:fmtMin(min)}));if(!tick)tick=setInterval(drawTimers,1000)}
function drawTimers(){const now=Date.now();$('#timers').innerHTML=timers.map(x=>{const rem=x.end-now;if(rem<=0&&!x.done){x.done=true;beep();toast(t('timeUp')+x.label)}const s=Math.max(0,Math.round(rem/1000));return`<div class="tmr ${x.done?'done':''}"><div><div style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.label)}</div><b>${x.done?t('ready'):String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}</b></div><button data-tx="${x.id}">${x.done?t('ok'):t('stop')}</button></div>`}).join('');
 $('#timers').querySelectorAll('[data-tx]').forEach(b=>b.onclick=()=>{const i=timers.findIndex(x=>x.id===b.dataset.tx);if(i>=0)timers.splice(i,1);drawTimers()});
 if(!timers.length){clearInterval(tick);tick=null}}

 let imgs=[];if(text.replace(/\s|--- p\. \d+ ---/g,'').length<150*Math.min(N,3)){for(let i=1;i<=Math.min(doc.numPages,maxImg);i++){const pg=await doc.getPage(i);const vp=pg.getViewport({scale:1.6});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;imgs.push(await new Promise(r=>c.toBlob(r,'image/jpeg',.85)))}}
 return{text,imgs}}
async function videoFrames(file,n){const url=URL.createObjectURL(file),v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=url;
 await new Promise((res,rej)=>{v.onloadeddata=res;v.onerror=()=>rej(new Error('video'));setTimeout(()=>rej(new Error('timeout')),15000)});
 const out=[],d=isFinite(v.duration)?v.duration:0;
 for(let k=0;k<n;k++){const x=d*(k+.5)/n;await new Promise(res=>{const to=setTimeout(res,3000);v.onseeked=()=>{clearTimeout(to);res()};v.currentTime=x});
  const s=Math.min(1,900/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');c.width=Math.round(v.videoWidth*s);c.height=Math.round(v.videoHeight*s);c.getContext('2d').drawImage(v,0,0,c.width,c.height);out.push(await new Promise(r=>c.toBlob(r,'image/jpeg',.82)))}
 URL.revokeObjectURL(url);return out}
async function startImport(){if(!aiReady()){aiSettings();return}
 const gob=$('#go'),stop=$('#stop');const val=s=>($(s)?.value||'').trim();
 const maxImg=await aiMaxImages();
 let material='',images=[],task='Extraia as receitas do material.',from='',url=val('#url'),cover=null;
 const which=val('#which');if(which)task+=` Traga apenas a receita que corresponde a: "${which}".`;
 try{gob.disabled=true;stop.hidden=false;
  if(impTab==='pdf'){const f=$('#file').files[0];if(!f)throw{msg:t('eNeedPdf')};from=t('fPdf')+' · '+f.name;const r=await readPdf(f,Math.min(maxImg,6));material=r.text;if(r.imgs.length){if(!maxImg)throw{msg:t('eScanned')};images=r.imgs;task+=' O PDF é escaneado: leia as imagens das páginas.'}}
  else if(impTab==='video'){material=val('#txt');from=url?t('fVideo')+' · '+url:t('fVideo');const fs=[...($('#file').files||[])];
   for(const f of fs){if(/^video\//.test(f.type)){status(spinMsg(t('frames')));try{const fr=await videoFrames(f,Math.min(6,Math.max(maxImg-images.length,0)));images.push(...fr);cover=fr[Math.floor(fr.length/2)]||null}catch(e){toast(t('eVideo'))}}else if(/^image\//.test(f.type))images.push(f)}
   if(!material&&!images.length)throw{msg:t('eNeedCap')};
   task='Extraia a receita deste vídeo de culinária a partir da legenda e dos quadros/prints (leia o texto que aparece na tela). Se faltar quantidade, estime e avise em "notes".'+(which?` Receita: "${which}".`:'')}
  else if(impTab==='photo'){images=[...($('#file').files||[])].filter(f=>/^image\//.test(f.type));if(!images.length)throw{msg:t('eNeedImg')};from=t('fPhoto');task+=' Leia o texto das imagens (pode ser manuscrito). Ignore fotos que não sejam texto.'}
  else if(impTab==='text'){material=val('#txt');if(!material)throw{msg:t('eNeedText')};from=url?t('fSite')+' · '+url:t('fText')}
  else if(impTab==='tm'){material=val('#txt');images=[...($('#file').files||[])].filter(f=>/^image\//.test(f.type));if(!material&&!images.length)throw{msg:t('eNeedCap')};from=url?t('fTm')+' · '+url:t('fTm');task='Extraia esta receita de Thermomix/Bimby (texto copiado do Cookidoo, do livro ou prints do app/da máquina). Ignore menus, avaliações e textos do site. Preencha "tm" e mantenha todos os ajustes da máquina em cada passo.'}
  else if(impTab==='spark'){const x=val('#txt');if(!x)throw{msg:t('eNeedWish')};task='Crie UMA receita original, testável e bem detalhada, de inspiração italiana quando fizer sentido, para este pedido: '+x;from=t('fAi')}
  if(images.length){if(!maxImg)throw{msg:t('eNoImgs')};images=images.slice(0,maxImg)}
  status(spinMsg(t('thinking')));
  ctl=new AbortController();
  const j=await aiJson(buildPrompt(task,material),images,ctl.signal);
  const list=(Array.isArray(j)?j:(j&&j.recipes)||[]).map(r=>{const n=normalize(r);if(url&&/^https?:\/\//.test(url)){n.sourceUrl=url;n.sourceLabel=n.sourceLabel||(url.includes('cookidoo')?'Cookidoo':url.includes('instagram')?'Instagram':url.includes('tiktok')?'TikTok':url.includes('youtu')?'YouTube':'Site')}return n});
  status('');showFound(list,from,cover)}
 catch(e){status('');const c=e?.code;if(c!=='cancelled')toast(e?.msg||(c==='not_granted'?t('eDenied'):c==='rate_limited'?t('eRate'):c==='invalid_json'?t('eJson'):c==='image_rejected'?t('eImg'):c==='prompt_too_large'?t('eBig'):t('eGeneric')))}
 finally{gob.disabled=false;stop.hidden=true;ctl=null}}
function showFound(list,from,cover){const box=$('#result');
 if(!list.length){box.innerHTML=`<div class="empty"><h3>${t('noneFound')}</h3><p>${t('noneP')}</p></div>`;return}
 if(list.length===1){S.draft={...list[0],_from:from,_photoBlob:cover};go('nova');return}
 box.innerHTML=`<div class="panel"><h2>${t('nFound',{n:list.length})}</h2><p>${t('foundP')}</p><div class="found">${list.map((r,i)=>`<label><input type="checkbox" data-i="${i}" checked><span>${esc(r.title)}<br><small>${esc(catDesc(catOf(r.category)))} · ${r.ingredients.length} ${t('nIng')} · ${r.steps.length} ${t('nSteps')}</small></span><button type="button" class="btn quiet" data-rev="${i}" style="margin-left:auto">${t('review')}</button></label>`).join('')}</div><div class="hero-act" style="justify-content:flex-start"><button class="btn red" id="saveall">${t('saveSel')}</button></div></div>`;
 box.querySelectorAll('[data-rev]').forEach(b=>b.onclick=e=>{e.preventDefault();S.draft={...list[+b.dataset.rev],_from:from};go('nova')});
 $('#saveall').onclick=()=>saveMany([...box.querySelectorAll('[data-i]:checked')].map(c=>list[+c.dataset.i]))}
async function saveMany(list){if(!list.length){toast(t('nothingSave'));return}let ok=0;for(const r of list){try{await persist(r);ok++}catch(e){break}}toast(t('savedN',{n:ok}));if(ok)go('')}

/* ---------- Cookidoo ---------- */
function toCookidoo(r,sv,f){const ing=(r.ingredients||[]).map(l=>isGrp(l)?l:(s=>(s.q?s.q+' ':'')+s.rest)(scaled(l,f)));const st=r.steps||[];
 const info=`${t('servings')}: ${sv}\n${t('prep')}: ${fmtMin(r.prepMin)}\n${t('cook')}: ${fmtMin(r.cookMin)}\n${t('diff')}: ${dname(r.difficulty)}`;
 const all=`${r.title}\n\n${info}\n\n${t('ckIng')}:\n${ing.join('\n')}\n\n${t('ckSteps')}:\n${st.map((s,i)=>(i+1)+'. '+s).join('\n')}${r.notes?'\n\n'+t('tip')+':\n'+r.notes:''}`;
 const parts=[r.title,info,ing.join('\n'),st.join('\n\n'),all,...st];
 const blk=(k,label,text)=>`<div class="blk"><header><b>${esc(label)}</b><button class="btn cp" data-cp="${k}">${ic('copy')}${t('copy')}</button></header><pre>${esc(text)}</pre></div>`;
 const m=modal(`<h3>${ic('tm')} ${t('ckT')}</h3><p>${esc(t('ckP',{n:sv,p:pl(sv)}))}</p><div class="ckb">${blk(0,t('ckName'),r.title)}${blk(1,t('ckInfo'),info)}${blk(2,t('ckIng'),ing.join('\n'))}
  <div class="blk"><header><b>${t('ckSteps')}</b><button class="btn cp" data-cp="3">${ic('copy')}${t('copy')}</button></header>${st.map((s,i)=>`<div class="stp"><span><b>${i+1}.</b> ${fmtStep(s)}</span><button class="btn cp quiet" data-cp="${5+i}" aria-label="${at('copy')} ${t('ckStep')} ${i+1}">${ic('copy')}</button></div>`).join('')}</div>
  <p style="font-size:14px">${t('ckNote')}</p></div>
  <div class="act"><a class="btn" href="https://cookidoo.${S.lang==='it'?'it':'com.br'}/" target="_blank" rel="noopener">Cookidoo ↗</a><button class="btn green" data-cp="4">${ic('copy')}${t('ckAll')}</button><button class="btn" data-x>${t('close')}</button></div>`,'help');
 m.querySelector('[data-x]').onclick=()=>m.remove();
 m.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>copyText(parts[+b.dataset.cp],t('copiedOk')))}

async function downloadSheet(r,sv,f){let ph=safeImg(r.photo);
 if(ph&&!ph.startsWith('data:')){try{const b=await (await fetch(ph)).blob();ph=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b)})}catch(e){ph=''}}
 const ing=(r.ingredients||[]).map(l=>isGrp(l)?`<li class="g">${esc(l)}</li>`:(s=>`<li><b>${esc(s.q)}</b> ${esc(s.rest)}</li>`)(scaled(l,f))).join('');const c=catOf(r.category);
 const html=`<!DOCTYPE html><html lang="${S.lang==='it'?'it':'pt-BR'}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(r.title)} · Matarello</title><style>body{font:15px/1.5 Georgia,serif;color:#2b1d18;max-width:860px;margin:0 auto;padding:28px}h1{font-size:34px;margin:4px 0}.k{color:#d63a2c;font:700 13px sans-serif}.bar{height:8px;background:linear-gradient(90deg,#2f8a4b 0 33%,#fff 33% 66%,#d63a2c 66%);border:1px solid #eee;margin-bottom:18px}img{width:100%;max-height:380px;object-fit:cover;border-radius:14px}.f{display:flex;gap:24px;font:600 14px sans-serif;margin:12px 0;flex-wrap:wrap}.c{display:grid;grid-template-columns:260px 1fr;gap:28px}ul{padding-left:18px}li{margin:4px 0}.g{list-style:none;margin-left:-18px;font-weight:700;color:#2f8a4b}ol li{margin-bottom:10px}b{color:#a92a1f}.t{background:#fdf1d8;padding:12px 16px;border-radius:10px}@media(max-width:640px){.c{grid-template-columns:1fr}}@media print{body{padding:0}}</style></head><body><div class="bar"></div><p class="k">MATARELLO · ${esc(c[1])} · ${esc(catDesc(c))}</p><h1>${esc(r.title)}</h1><p>${esc(r.subtitle)}</p>${ph?`<img src="${ph}" alt="">`:''}<div class="f"><span>${t('prep')}: ${fmtMin(r.prepMin)}</span><span>${t('cook')}: ${fmtMin(r.cookMin)}</span><span>${t('servings')}: ${sv}</span><span>${t('diff')}: ${esc(dname(r.difficulty))}</span></div><div class="c"><div><h2>${t('ingredients')}</h2><ul>${ing}</ul><h2>${t('equipment')}</h2><ul>${(r.equipment||[]).map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div><div><h2>${t('method')}</h2><ol>${(r.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${r.notes?`<div class="t"><b>${t('tip')}:</b> ${esc(r.notes)}</div>`:''}${r.sourceUrl||r.sourceLabel?`<p>${t('sheetSrc')}: ${esc(r.sourceLabel)} ${esc(r.sourceUrl)}</p>`:''}</div></div></body></html>`;
 const name=r.title.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'receita';
 try{await saveFile(name+'.html',html,'text/html');toast(t('sheetSaved'))}catch(e){if(e?.code!=='declined')toast(t('sheetFail'))}}

 if(!window.claude){S.recipes=local;S.ready=true;renderFoot();try{navigator.storage?.persist?.()}catch(e){}route(true,true);return}
 S.recipes=local;route(true,true);

 S.assets=assets;S.sample=sample;S.dl=dl;

 else{S.ready=true;renderFoot();route(true,true)}})();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!window.claude)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
