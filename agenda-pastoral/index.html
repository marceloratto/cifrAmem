:root{color-scheme:light;--bg:#fff;--ink:#1b1a17;--mut:#6c6860;--line:#e9e5dd;--card:#f8f6f1;--acc:#8a1c3b;--onacc:#fff;--lw:#e6d6a3;--lv:#6a3fa3;--lg:#2e7a3c;--lr:#c0392b;--lp:#e38aae;--warn:#8a5a00}

#toast{position:fixed;left:50%;bottom:5.5rem;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}

<script>{

    A=(t,n,c,r)=>m.set(iso(t),{n,c,r});

  let an=U(y,3,25);if(an>=E-7*DAY&&an<=E+7*DAY)an=E+8*DAY;else if(!dow(an))an+=DAY;A(an,'Anunciação do Senhor','w','S');
