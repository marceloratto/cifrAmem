const OUT='__outra',lopt=(arr,v,ph)=>`<option value="">${ph}</option>`+arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
function locHTML(p){return`<p class="sub">Onde participa</p>

 <label>Paróquia<select id="${p}-par"></select><input id="${p}-part" maxlength="100" placeholder="Digite o nome da paróquia" hidden></label>`}
function locBind(p,v0){const v={...(v0||{})},g=s=>$('#'+p+'-'+s),dio=g('dio'),diot=g('diot'),dec=g('dec'),dect=g('dect'),par=g('par'),part=g('part');
 const D=()=>LOC.find(d=>d.nome===dio.value);
 const sel=(s,t,list,val,ph)=>{if(list.length){s.hidden=false;const inl=!val||list.includes(val);s.innerHTML=lopt(list,inl?val:'',ph)+`<option value="${OUT}" ${!inl?'selected':''}>Outra (digitar)</option>`;t.hidden=inl;t.value=inl?'':val}else{s.hidden=true;s.innerHTML='';t.hidden=false;t.value=val||''}};
 const fPar=()=>{const d=D(),x=d?.decanatos.find(k=>k.nome===dec.value),ps=x?x.paroquias:(d?.decanatos||[]).flatMap(k=>k.paroquias);sel(par,part,ps,v.paroquia,'Selecione a paróquia')};
 const fDec=()=>{const d=D();sel(dec,dect,(d?.decanatos||[]).map(k=>k.nome),v.decanato,'Selecione o decanato');fPar()};
 sel(dio,diot,LOC.map(d=>d.nome),v.diocese,'Selecione a diocese');fDec();
 dio.onchange=()=>{diot.hidden=dio.value!==OUT;v.decanato='';v.paroquia='';fDec()};
 dec.onchange=()=>{dect.hidden=dec.value!==OUT;v.paroquia='';fPar()};
 par.onchange=()=>{part.hidden=par.value!==OUT}}
function locRead(p){const g=s=>$('#'+p+'-'+s),val=(s,t)=>s.hidden||s.value===OUT?t.value.trim():s.value;
 const diocese=val(g('dio'),g('diot'));return{regional:LOC.some(d=>d.nome===diocese)?REGIONAL:'',diocese,decanato:val(g('dec'),g('dect')),paroquia:val(g('par'),g('part'))}}

// presença (Vou / Talvez / Não vou)
var RS=[],UID=null,USR=null,NAMES={},CURRS=null;
const RSN={sim:'Vou',talvez:'Talvez',nao:'Não vou'};
function canSee(id){return mode!=='fb'||!ME||ME.papel==='admin'||(ME.ver||['todas']).some(x=>x==='todas'||x===id)}
function shared(){return(mode==='db'&&!!UID)||(mode==='fb'&&!!ME)}
function myId(){return mode==='fb'?(FBU?.email||'').toLowerCase():UID}
const rsKey=(ev,d)=>ev+'~'+d,safeSeg=s=>String(s).replace(/[^A-Za-z0-9_.~:@+-]/g,'-');
function rsOf(ev,d){return RS.filter(r=>r.ev===ev&&r.date===d)}
function rsName(r){return mode==='fb'?(r.nome||r.uid):(NAMES[r.uid]||'Alguém')}
async function rsNames(){if(mode!=='db'||!USR?.profiles)return;const ids=[...new Set(RS.map(r=>r.uid))].filter(i=>!(i in NAMES));if(!ids.length)return;
 try{const ps=await USR.profiles(ids);ids.forEach(i=>NAMES[i]=ps?.[i]?.name||'');rsRender();render()}catch{}}
function rsSum(ev,d){if(!shared())return'';const l=rsOf(ev,d),c=k=>l.filter(r=>r.resp===k).length;if(!l.length)return'';
 return[c('sim')&&c('sim')+(c('sim')>1?' vão':' vai'),c('talvez')&&c('talvez')+' talvez',c('nao')&&c('nao')+' não'].filter(Boolean).join(', ')}
function rsBlock(e,t){if(!shared()||!e.id)return'';return`<div class="rs" id="rsb"></div>`}
function rsRender(){const box=$('#rsb');if(!box||!CURRS)return;const{ev,d}=CURRS,l=rsOf(ev,d),me=l.find(r=>r.uid===myId());
 const grp=k=>{const n=l.filter(r=>r.resp===k).map(rsName);return n.length?`<p class="fine"><b>${RSN[k]==='Vou'?'Vão':RSN[k]==='Talvez'?'Talvez':'Não vão'} (${n.length}):</b> ${n.map(x=>esc(x)).join(', ')}</p>`:''};
 box.innerHTML=`<p class="sub">Presença em ${fd(parse(d))}</p><div class="rsb" role="group" aria-label="Sua presença">${Object.entries(RSN).map(([k,v])=>`<button type="button" class="btn" data-rs="${k}" aria-pressed="${me?.resp===k}">${v}</button>`).join('')}</div>${grp('sim')}${grp('talvez')}${grp('nao')}${l.length?'':'<p class="fine">Ninguém respondeu ainda.</p>'}`}
async function rsSet(resp){if(!CURRS)return;const{ev,d}=CURRS,me=myId();if(!me)return;const id=safeSeg(rsKey(ev,d)+'~'+me),cur=rsOf(ev,d).find(r=>r.uid===me);
 try{if(cur&&cur.resp===resp)await db.collection('rsvp').doc(id).delete();else await db.collection('rsvp').doc(id).set({ev,date:d,uid:me,resp,...(mode==='fb'?{nome:ME?.nome||FBU?.displayName||me}:{})})}
 catch(e){toast(e?.code==='permission-denied'||e?.code==='invalid_argument'?'Você não pode responder nesta agenda.':'Não foi possível registrar.')}}
function rsSub(){const un=db.collection('rsvp').onSnapshot(s=>{RS=s.docs.map(x=>({id:x.id,...x.data()}));rsRender();render();rsNames()},()=>{});if(mode==='fb')fbUn.push(un)}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-rs]');if(b)rsSet(b.dataset.rs)});

// Mural de avisos (por grupo/agenda), com "Ciente" e respostas
var AV=[],CI=[],RE=[],muralOn=false,MF='todas',MOPEN=new Set(),avUn=[];
function avSeen(){return LS.get('agp-avseen','')}
function hm(iso){try{return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}catch{return''}}
function dtBr(iso){const d=new Date(iso);return isNaN(d)?'':p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear()+' '+hm(iso)}
function linkify(s){return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,'<br>')}
function whoName(uid,nome){return mode==='fb'?(nome||uid):(NAMES[uid]||nome||'Alguém')}
function avVisible(){const t=iso(TODAY),vis=new Set(AGS().filter(a=>!hidden.has(a.id)).map(a=>a.id));return AV.filter(a=>vis.has(a.ag)&&avTarget(a)&&(!a.ate||a.ate>=t)&&(MF==='todas'||a.ag===MF)).sort((a,b)=>(b.fixo?1:0)-(a.fixo?1:0)||(b.quando||'').localeCompare(a.quando||''))}
function avNovos(){const s=avSeen(),me=myId();return AV.filter(a=>(a.quando||'')>s&&a.autor!==me&&canSee(a.ag)&&avTarget(a)&&(!a.ate||a.ate>=iso(TODAY))).length}
function canAvEdit(a){return a.autor===myId()||(mode==='fb'&&ME?.papel==='admin')}
function canAvPost(){return shared()&&!ro&&AGS().some(a=>canAg(a.id))}
function prox(){const box=$('#prox');if(!box)return;const from=TODAY,oc=expand(from,from+60*DAY),it=[],vistos=new Set();
 for(let t=from;t<=from+60*DAY&&it.length<7;t+=DAY)for(const e of oc[iso(t)]||[]){if(it.length>=7)break;if(e.rep&&e.rep!=='none'){if(vistos.has(e.id))continue;vistos.add(e.id)}if(t===TODAY&&e.start&&!e.all){const n=new Date(),hh=p2(n.getHours())+':'+p2(n.getMinutes());if((e.end||e.start)<hh)continue}it.push({e,t})}
 box.innerHTML=`<div class="mh"><h2>Próximos eventos</h2>${it.length?'<button class="btn sm" data-v="lista">Ver todos</button>':''}</div>${it.length?it.map(({e,t})=>{const d=new Date(t),rs=rsSum(e.id,iso(t)),dd=Math.round((t-TODAY)/DAY);
  return`<button class="px" data-id="${e.id}" data-t="${t}" style="--c:${col(e)}"><span class="pd"><b>${p2(d.getUTCDate())}/${p2(d.getUTCMonth()+1)}</b><small>${dd===0?'hoje':dd===1?'amanhã':SEM[d.getUTCDay()].slice(0,3)}</small></span><span class="pt"><strong>${ico(e.tipo,col(e))}${esc(e.title)}</strong><small>${e.all||!e.start?'dia todo':esc(e.start)+(e.end?'–'+esc(e.end):'')} · ${esc(ag(e.ag)?.name||'')}${e.local?' · '+esc(e.local):''}${rs?' · '+rs:''}</small></span></button>`}).join(''):'<p class="empty">Nenhum evento nos próximos 60 dias.</p>'}`}
function mural(){const box=$('#mural');if(!box)return;
 if(!shared()){box.innerHTML=`<div class="mh"><h2>Mural de avisos</h2></div><p class="empty">${mode==='local'?'O mural funciona na agenda compartilhada: os avisos chegam a todos do grupo.':'Entre na agenda para ver os avisos.'}</p>`;return}
 const L=avVisible(),ags=AGS().filter(a=>!hidden.has(a.id)&&AV.some(v=>v.ag===a.id));
 box.innerHTML=`<div class="mh"><h2>Mural de avisos</h2>${canAvPost()?'<button class="btn pri" data-avnew>+ Aviso</button>':''}</div>${mode==='fb'&&ME?`<div class="ph">${canAvPost()?'<button class="btn sm" data-qnew>+ Enquete</button>':''}<button class="btn sm" data-pnew>+ Pedido de oração</button></div>`:''}

 <p class="hl">Toque em cada assunto para abrir a explicação. Você pode voltar aqui a qualquer hora pelo botão <b>?</b> no alto da tela.</p>
 ${S('1. Entrar na agenda',`<p>Toque em <b>Entrar com Google</b> e escolha a sua conta (o seu Gmail).</p><p>Na primeira vez, toque em <b>Pedir acesso</b>, preencha seu nome, telefone, função e paróquia e toque em <b>Enviar pedido</b>. O coordenador aprova e, a partir daí, você vê os eventos.</p>`)}

 ${S('3. Calendário ou Lista',`<p><b>Calendário</b> mostra o mês inteiro em quadradinhos, como um calendário de parede.</p><p><b>Lista</b> mostra os próximos eventos um embaixo do outro, separados por mês. É mais fácil de ler no celular.</p>`)}
 ${S('4. O que significam as cores',`<p>A <b>faixa colorida embaixo de cada dia</b> é a cor litúrgica: verde (Tempo Comum), roxo (Advento e Quaresma), branco/dourado (Natal, Páscoa e festas), vermelho (mártires, Pentecostes, Paixão) e rosa (Gaudete e Laetare).</p><p>O <b>losango</b> ao lado do número marca uma solenidade ou festa. A faixa verde no alto mostra o tempo litúrgico e o ano (A, B ou C).</p><p>Cada <b>grupo</b> (Pastoral Familiar, Decanato, Música…) tem a sua cor nos eventos. Os <b>ícones</b> mostram o tipo: cálice = missa, duas pessoas = reunião, coração = encontro, livro = formação, nota musical = ensaio, montanha = retiro, taças = confraternização.</p>`)}
 ${S('5. Ver um evento e marcar presença',`<p>Toque no evento. Abre uma janela com todos os detalhes.</p><p>No alto aparecem os botões <b>Vou</b>, <b>Talvez</b> e <b>Não vou</b>. Toque no que for o seu caso. Para desfazer, toque de novo no mesmo botão. Embaixo aparece quem já respondeu.</p>`)}
